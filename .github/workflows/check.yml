name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      # Builds the checks and evaluates nixosConfigurations.xps13.
      - run: nix flake check --print-build-logs
      - name: Evaluate darwinConfigurations.macbook
        run: nix eval --raw .#darwinConfigurations.macbook.system.drvPath
